# =============================================================================
# Nginx configuration — Dr. Alfredo Elías Alfaro Ramos Campaign Website
# Static single-page site served from /var/www/alfaro-ramos/
#
# HOW TO USE
# ----------
# 1. Copy this file to /etc/nginx/sites-available/alfaro-ramos
# 2. Enable it:  sudo ln -s /etc/nginx/sites-available/alfaro-ramos \
#                              /etc/nginx/sites-enabled/alfaro-ramos
# 3. Test config: sudo nginx -t
# 4. Reload:      sudo systemctl reload nginx
#
# Replace "example.com" below with your actual domain name (or server IP).
# =============================================================================

server {

    # ─── 1. LISTENING PORT & DOMAIN ─────────────────────────────────────────
    #
    # Nginx listens on port 80 (standard HTTP).
    # "server_name" tells Nginx which incoming requests belong to THIS site.
    # If you have a domain (e.g. alfaro.itcr.ac.cr) put it here.
    # Using "_" means "catch all requests regardless of hostname" — useful
    # when you only have an IP address and no domain yet.
    # ────────────────────────────────────────────────────────────────────────
    listen 80;
    listen [::]:80;          # also listen on IPv6

    server_name _;           # replace _ with your domain, e.g.: alfaro.itcr.ac.cr


    # ─── 2. DOCUMENT ROOT ───────────────────────────────────────────────────
    #
    # This is the folder on the Linux server where your website files live.
    # Copy the entire contents of personal-webpage/ into this folder:
    #   sudo mkdir -p /var/www/alfaro-ramos
    #   sudo cp -r /path/to/personal-webpage/* /var/www/alfaro-ramos/
    #   sudo chown -R www-data:www-data /var/www/alfaro-ramos
    # ────────────────────────────────────────────────────────────────────────
    root /var/www/alfaro-ramos;

    # "index" tells Nginx which file to serve when a visitor hits the root URL.
    # Since this is a single-page site, index.html is the only entry point.
    index index.html;


    # ─── 3. CHARSET ─────────────────────────────────────────────────────────
    #
    # Forces UTF-8 encoding in all HTTP responses so Spanish characters
    # (accents, ñ, etc.) render correctly in every browser.
    # ────────────────────────────────────────────────────────────────────────
    charset utf-8;


    # ─── 4. SINGLE-PAGE APP ROUTING ─────────────────────────────────────────
    #
    # "location /" is the main routing rule — it handles every URL request.
    #
    # try_files $uri $uri/ /index.html;
    # ┌─ $uri        → try the exact file the browser requested
    # ├─ $uri/       → try it as a directory (looks for index.html inside)
    # └─ /index.html → if nothing matched, serve index.html anyway
    #
    # For this site this matters if a visitor bookmarks a URL like
    # /sobre-mi directly: instead of a 404, they still get the page.
    # ────────────────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }


    # ─── 5. STATIC ASSET CACHING ────────────────────────────────────────────
    #
    # Browsers are told to cache CSS, JS, images, fonts and icons for 1 year.
    # "immutable" means the browser won't even recheck with the server during
    # that period — the page loads faster on repeat visits.
    #
    # This is safe because every time you update a file its name/path changes
    # (or you can add a query string like ?v=2 to bust the cache).
    # ────────────────────────────────────────────────────────────────────────
    location ~* \.(css|js|woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;          # don't fill logs with font/style hits
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.pdf$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }


    # ─── 6. SECURITY HEADERS ────────────────────────────────────────────────
    #
    # These HTTP headers are sent with every response and protect visitors:
    #
    # X-Frame-Options SAMEORIGIN
    #   Prevents the page from being embedded in an <iframe> on another site
    #   (blocks clickjacking attacks).
    #
    # X-Content-Type-Options nosniff
    #   Forces the browser to respect the declared Content-Type and not guess.
    #   Prevents some injection attacks via uploaded files.
    #
    # Referrer-Policy strict-origin-when-cross-origin
    #   Controls what URL information is shared when a visitor clicks a link
    #   to another site — keeps the candidate's visitor data private.
    #
    # Permissions-Policy
    #   Disables browser features (camera, microphone, geolocation) that this
    #   site does not need — reduces attack surface.
    # ────────────────────────────────────────────────────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN"                        always;
    add_header X-Content-Type-Options     "nosniff"                           always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"   always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;


    # ─── 7. HIDE NGINX VERSION ───────────────────────────────────────────────
    #
    # By default Nginx advertises its version in error pages and the Server
    # header (e.g. "nginx/1.24.0"). Hiding it makes it marginally harder for
    # automated scanners to target known vulnerabilities.
    # This is set globally in /etc/nginx/nginx.conf but included here as a
    # reminder — add "server_tokens off;" there if not already present.
    # ────────────────────────────────────────────────────────────────────────
    # server_tokens off;   # set in /etc/nginx/nginx.conf, not here


    # ─── 8. GZIP COMPRESSION ────────────────────────────────────────────────
    #
    # Compresses HTML, CSS and JS before sending them to the browser.
    # A typical HTML page shrinks by ~70 %, making the site load faster
    # especially on mobile or slow connections.
    # ────────────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;              # 1 (fastest) – 9 (smallest); 6 is the sweet spot
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;


    # ─── 9. BLOCK HIDDEN FILES ───────────────────────────────────────────────
    #
    # Prevents visitors from accessing dot-files like .gitignore, .env, etc.
    # Returns 404 (not 403) so it doesn't reveal that the file exists.
    # ────────────────────────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }


    # ─── 10. CUSTOM ERROR PAGES (OPTIONAL) ───────────────────────────────────
    #
    # If Nginx cannot find a file it would normally return a plain HTML error.
    # These lines send the visitor back to index.html instead, which looks
    # professional and keeps them on the site.
    # ────────────────────────────────────────────────────────────────────────
    error_page 404 /index.html;

}

# =============================================================================
# OPTIONAL: HTTPS redirect (uncomment after you install an SSL certificate)
#
# If you add a domain and obtain a free Let's Encrypt certificate with:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d yourdomain.com
#
# Certbot will modify this file automatically to add HTTPS.
# The block below is the manual equivalent — it redirects all HTTP traffic
# to HTTPS so the site is always served over an encrypted connection.
# =============================================================================
#
# server {
#     listen 80;
#     listen [::]:80;
#     server_name yourdomain.com;
#     return 301 https://$host$request_uri;
# }
#
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name yourdomain.com;
#
#     ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256;
#     ssl_prefer_server_ciphers off;
#
#     # ... rest of the server block above goes here ...
# }
